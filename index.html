<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YAKABE GAMES｜ブラウザゲーム</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2230;--muted:#6a7385;--card:#fff;--line:#e3e6ec;--accent:#e8453c;--chip:#eceff4;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--fg:#eef1f6;--muted:#9aa3b5;--card:#1b2029;--line:#2a313e;--chip:#252c38;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#12151c;--fg:#eef1f6;--muted:#9aa3b5;--card:#1b2029;--line:#2a313e;--chip:#252c38;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;line-height:1.6;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10;}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);}
.bar{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;color:inherit;text-decoration:none;}
.logo .ic{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#ff9a3c,#e8453c);display:grid;place-items:center;font-size:18px;}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;}
nav a{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;white-space:nowrap;}
nav a.on,nav a:hover{background:var(--chip);color:var(--fg);}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px;}
.hero{padding:22px 20px;border-radius:18px;background:linear-gradient(135deg,#ff9a3c,#e8453c 55%,#b8286f);color:#fff;}
.hero h1{margin:0 0 4px;font-size:clamp(22px,5vw,32px);}
.hero p{margin:0;opacity:.92;font-size:14px;}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 10px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{border:0;background:var(--chip);color:var(--fg);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer;}
.chip.on{background:var(--accent);color:#fff;}
.sp{flex:1}
select,input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 10px;font-size:14px;}
h2{font-size:18px;margin:6px 0 2px;}
.count{font-size:12px;color:var(--muted);margin-bottom:12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s;}
a.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0002;}
.thumb{position:relative;height:130px;display:grid;place-items:center;font-size:58px;}
.badge{position:absolute;top:8px;left:8px;background:#fff;color:var(--accent);font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;}
.cat{position:absolute;right:8px;bottom:8px;background:#0007;color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1;}
.body h3{margin:0;font-size:16px;}
.body .tag{font-size:13px;font-weight:700;}
.body .desc{font-size:12px;color:var(--muted);flex:1;}
.play{margin-top:8px;align-self:flex-start;background:var(--accent);color:#fff;font-weight:900;font-size:13px;padding:6px 16px;border-radius:999px;}
.soon{border-style:dashed;opacity:.75;text-align:center;justify-content:center;min-height:200px;padding:20px;color:var(--muted);font-weight:800;}
.empty{padding:40px 0;text-align:center;color:var(--muted);}
section.about{margin-top:34px;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:14px;}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 30px;}
.admin{margin-top:18px;padding:14px;border-radius:14px;border:2px dashed var(--accent);background:var(--card);font-size:13px;}
.admin form{display:grid;gap:8px;margin-top:8px;} .admin input{width:100%;} .row2{display:flex;gap:8px;flex-wrap:wrap;} .row2 input[type=color]{width:44px;padding:2px;}
.arow{display:flex;gap:6px;margin-top:6px;} .mini{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;}
</style>
</head>
<body>
<header><div class="bar">
 <a class="logo" href="#top"><span class="ic">🎮</span>YAKABE GAMES</a>
 <nav id="nav"><a class="on" href="#games">ゲーム</a><a href="#about">このサイトについて</a></nav>
</div></header>

<main id="top">
 <div class="hero"><h1>YAKABE GAMES</h1><p>ブラウザですぐ遊べるゲームを、どんどん追加していきます。スマホ・PCどちらでもOK。</p></div>

 <div class="tools">
  <div class="chips" id="chips"></div>
  <span class="sp"></span>
  <input type="search" id="q" placeholder="ゲームを検索">
  <select id="sort"><option value="new">新しい順</option><option value="name">名前順</option></select>
 </div>
 <h2 id="games">ゲーム一覧</h2>
 <div class="count" id="count"></div>
 <div class="grid" id="grid"></div>

 <section class="about" id="about">
  <b>このサイトについて</b><br>
  YAKABE GAMES は、ブラウザだけで遊べるゲームを集めたサイトです。インストールや登録は不要で、リンクを開くだけで遊べます。
  新しいゲームができたら、この一覧に追加していきます。
 </section>
</main>
<footer>© YAKABE GAMES</footer>

<script>
var GAMES = [
 { id:"yakabe-panic", title:"矢加部パニック", tagline:"焼きそばパンを投げて、街のワルを撃退！",
   desc:"3Dの街を走り回り、パンを拾って敵に投げる。ジャンプ中は必殺技！ ミッションもあるよ。",
   category:"アクション", released:"2026-11-26", url:"games/yakabe_panic.html",
   emoji:"🍞", colors:["#ff9a3c","#e8453c"] },
 { id:"lane-dodge", title:"LANE DODGE", tagline:"車をよけてボスを倒せ！",
   desc:"ネオンが光る街で君はどこまでよけれる？",
   category:"アーケード", released:"2026-11-26", url:"games/lane_dodge.html",
   emoji:"🏎", colors:["#000000","#00e1ff"] },
 { id:"bread-throw", title:"矢加部のパン投げチャレンジ", tagline:"パンを投げてハイスコアを目指そう！",
   desc:"タイミングよくパンを投げて、記録に挑戦しよう！",
   category:"アクション", released:"2026-11-26", url:"games/bread_challenge.html",
   emoji:"🥖", colors:["#f7b267","#e76f51"] }
];
var NEW_DAYS=30, state={cat:"すべて",q:"",sort:"new"};
var $=function(id){return document.getElementById(id);};
function renderChips(){
 var cats=["すべて"]; GAMES.forEach(function(g){if(cats.indexOf(g.category)<0)cats.push(g.category);});
 var box=$("chips"); box.textContent="";
 cats.forEach(function(c){var b=document.createElement("button");b.className="chip"+(c===state.cat?" on":"");b.textContent=c;b.onclick=function(){state.cat=c;renderChips();renderGrid();};box.appendChild(b);});
}
function isNew(g){return (Date.now()-new Date(g.released).getTime())<NEW_DAYS*86400000;}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function renderGrid(){
 var list=GAMES.filter(function(g){var ok=state.cat==="すべて"||g.category===state.cat;var s=(g.title+g.tagline+g.desc+g.category).toLowerCase();return ok&&s.indexOf(state.q.toLowerCase())>=0;});
 list.sort(function(a,b){return state.sort==="name"?a.title.localeCompare(b.title,"ja"):new Date(b.released)-new Date(a.released);});
 $("count").textContent=list.length+"作品を表示";var grid=$("grid");grid.textContent="";
 list.forEach(function(g){var c=el("a","card");c.href=g.url;
 var t=el("div","thumb",g.emoji);t.style.background="linear-gradient(135deg,"+g.colors[0]+","+g.colors[1]+")";
 if(isNew(g))t.appendChild(el("span","badge","NEW"));t.appendChild(el("span","cat",g.category));c.appendChild(t);
 var b=el("div","body");b.appendChild(el("h3",null,g.title));b.appendChild(el("div","tag",g.tagline));b.appendChild(el("div","desc",g.desc));b.appendChild(el("span","play","▶ あそぶ"));c.appendChild(b);grid.appendChild(c);});
 if(state.cat==="すべて"&&!state.q)grid.appendChild(el("div","card soon","🚧 次のゲームを準備中…"));
 if(!list.length)grid.appendChild(el("div","empty","見つかりませんでした"));
}
$("q").oninput=function(e){state.q=e.target.value;renderGrid();};
$("sort").onchange=function(e){state.sort=e.target.value;renderGrid();};
renderChips();renderGrid();
</script>
</body>
</html>
